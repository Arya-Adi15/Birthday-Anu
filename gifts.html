<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Gift Surprise 🎁</title>

    <!-- GOOGLE FONT -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {

            min-height: 100vh;

            overflow-x: hidden;

            background: linear-gradient(135deg, #ffe0f0, #dfe8ff);

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;
        }

        /* ================= BACKGROUND EFFECT ================= */

        body::before,
        body::after {

            content: "";

            position: absolute;

            border-radius: 50%;

            filter: blur(90px);

            z-index: 0;
        }

        body::before {

            width: 260px;
            height: 260px;

            background: rgba(255, 105, 180, 0.3);

            top: -40px;
            left: -50px;
        }

        body::after {

            width: 300px;
            height: 300px;

            background: rgba(110, 140, 255, 0.3);

            bottom: -50px;
            right: -50px;
        }

        /* ================= HOME BUTTON ================= */

        .home-btn {

            position: fixed;

            top: 25px;
            left: 25px;

            text-decoration: none;

            padding: 12px 22px;

            border-radius: 50px;

            background: rgba(255, 255, 255, 0.25);

            backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 255, 255, 0.4);

            color: #111;

            font-weight: 600;

            transition: 0.4s ease;

            z-index: 999;
        }

        .home-btn:hover {

            background: #ff2e93;

            color: white;

            transform: translateY(-4px);

            box-shadow: 0 10px 25px rgba(255, 46, 147, 0.35);
        }

        /* ================= MAIN CARD ================= */

        .gift-section {

            width: 90%;
            max-width: 700px;

            background: rgba(255, 255, 255, 0.18);

            backdrop-filter: blur(14px);

            border: 1px solid rgba(255, 255, 255, 0.25);

            border-radius: 35px;

            padding: 60px 40px;

            text-align: center;

            position: relative;
            z-index: 2;

            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.15);
        }

        /* ================= HEADING ================= */

        .gift-section h1 {

            font-size: 52px;

            color: #ff2e93;

            margin-bottom: 15px;
        }

        .gift-section .subtitle {

            color: #666;

            font-size: 18px;

            margin-bottom: 45px;
        }

        /* ================= GIFT BOX ================= */

        .gift-box {

            width: 180px;
            height: 180px;

            margin: auto;

            border-radius: 35px;

            background: linear-gradient(135deg, #ff4da6, #ff0077);

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 100px;

            cursor: pointer;

            position: relative;

            transition: 0.5s ease;

            animation: float 3s ease-in-out infinite;

            box-shadow: 0 20px 40px rgba(255, 0, 119, 0.35);
        }

        .gift-box:hover {

            transform: scale(1.08) rotate(3deg);

            box-shadow: 0 25px 50px rgba(255, 0, 119, 0.5);
        }

        /* Ribbon */

        .gift-box::before {

            content: "";

            position: absolute;

            width: 35px;
            height: 100%;

            background: rgba(255, 255, 255, 0.75);
        }

        .gift-box::after {

            content: "";

            position: absolute;

            width: 100%;
            height: 35px;

            background: rgba(255, 255, 255, 0.75);
        }

        /* ================= RESULT ================= */

        #gift-result {

            margin-top: 40px;

            font-size: 24px;

            color: #333;

            line-height: 40px;

            transition: 0.5s ease;

            min-height: 80px;
        }

        .show {

            transform: scale(1.08);

            color: #ff2e93;
        }

        /* ================= BUTTON ================= */

        .open-btn {

            margin-top: 30px;

            padding: 14px 30px;

            border: none;

            border-radius: 50px;

            background: linear-gradient(135deg, #6d8dff, #4b6dff);

            color: white;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.4s ease;

            box-shadow: 0 12px 25px rgba(75, 109, 255, 0.3);
        }

        .open-btn:hover {

            transform: translateY(-4px);

            box-shadow: 0 18px 35px rgba(75, 109, 255, 0.45);
        }

        /* ================= FLOAT ANIMATION ================= */

        @keyframes float {

            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-15px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 768px) {

            body {
                padding: 20px;
            }

            .gift-section {

                padding: 40px 20px;
            }

            .gift-section h1 {

                font-size: 34px;
            }

            .subtitle {

                font-size: 15px;
            }

            .gift-box {

                width: 140px;
                height: 140px;

                font-size: 75px;
            }

            .gift-box::before {

                width: 25px;
            }

            .gift-box::after {

                height: 25px;
            }

            #gift-result {

                font-size: 18px;

                line-height: 30px;
            }

            .home-btn {

                top: 15px;
                left: 15px;

                font-size: 14px;

                padding: 10px 18px;
            }

            .open-btn {

                width: 100%;
            }
        }

        @media (max-width: 480px) {

            .gift-section h1 {

                font-size: 28px;
            }

            #gift-result {

                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <!-- HOME BUTTON -->

    <a href="index.html" class="home-btn">⬅ Home</a>

    <!-- MAIN SECTION -->

    <section class="gift-section">

        <h1>Open Your Surprise 🎁</h1>

        <p class="subtitle">
            Tap the magical gift box and reveal your special surprise ❤️
        </p>

        <!-- GIFT BOX -->

        <div class="gift-box" onclick="openGift()">
            🎁
        </div>

        <!-- RESULT -->

        <p id="gift-result">
            Click the gift box to reveal your surprise 💖
        </p>

        <!-- BUTTON -->

        <button class="open-btn" onclick="openGift()">
            Open Surprise ✨
        </button>

    </section>

    <!-- JAVASCRIPT -->

    <script>

        function openGift() {

            let surprises = [

                "🍫 Chocolate Treat Date with Me!",

                "🎬 Romantic Movie Night Together!",

                "🌹 Unlimited Hug Coupon Just for You!",

                "🍕 Candle Light Dinner Surprise!",

                "💌 A Secret Love Letter is Waiting!",

                "🎁 One Special Gift From My Heart!",

                "📸 Beautiful Memory Photo Surprise!",

                "💍 A Forever Promise From Me ❤️",

                "✈️ Dream Date Coming Soon!",

                "🎵 Your Favorite Song Dedicated to You!"
            ];

            let randomGift = surprises[Math.floor(Math.random() * surprises.length)];

            let result = document.getElementById("gift-result");

            result.innerText = randomGift;

            result.classList.add("show");

            // HEART EFFECT

            createHeart();

            setTimeout(() => {

                result.classList.remove("show");

            }, 700);
        }

        // FLOATING HEART EFFECT

        function createHeart() {

            const heart = document.createElement("div");

            heart.innerHTML = "💖";

            heart.style.position = "fixed";

            heart.style.left = Math.random() * 100 + "vw";

            heart.style.top = "100vh";

            heart.style.fontSize = "25px";

            heart.style.animation = "fly 4s linear forwards";

            document.body.appendChild(heart);

            setTimeout(() => {

                heart.remove();

            }, 4000);
        }

        // HEART ANIMATION

        const style = document.createElement("style");

        style.innerHTML = `
        
        @keyframes fly {
        
            0%{
                transform: translateY(0) scale(1);
                opacity:1;
            }

            100%{
                transform: translateY(-120vh) scale(1.8);
                opacity:0;
            }
        }
        
        `;

        document.head.appendChild(style);

    </script>

</body>

</html>
